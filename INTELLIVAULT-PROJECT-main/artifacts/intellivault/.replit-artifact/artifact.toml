kind = "web"
previewPath = "/"
title = "IntelliVault AI"
version = "1.0.0"
id = "artifacts/intellivault"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20160

[services.development]
run = "pnpm --filter @workspace/intellivault run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/intellivault", "run", "build" ]
publicDir = "artifacts/intellivault/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20160"
BASE_PATH = "/"
